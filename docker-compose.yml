services:
  rabbitmq1:
    image: rabbitmq:3.13-management
    container_name: rabbitmq1
    hostname: rabbitmq1
    environment:
      RABBITMQ_ERLANG_COOKIE: "SECRET_CLUSTER_COOKIE_HA_RABBITMQ"
      RABBITMQ_NODENAME: "rabbit@rabbitmq1"
    volumes:
      - ./rabbitmq-cluster/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq-cluster/definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - rabbitmq-cluster-net

  rabbitmq2:
    image: rabbitmq:3.13-management
    container_name: rabbitmq2
    hostname: rabbitmq2
    environment:
      RABBITMQ_ERLANG_COOKIE: "SECRET_CLUSTER_COOKIE_HA_RABBITMQ"
      RABBITMQ_NODENAME: "rabbit@rabbitmq2"
    volumes:
      - ./rabbitmq-cluster/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq-cluster/definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - "5673:5672"
      - "15673:15672"
    networks:
      - rabbitmq-cluster-net
    depends_on:
      - rabbitmq1

  rabbitmq3:
    image: rabbitmq:3.13-management
    container_name: rabbitmq3
    hostname: rabbitmq3
    environment:
      RABBITMQ_ERLANG_COOKIE: "SECRET_CLUSTER_COOKIE_HA_RABBITMQ"
      RABBITMQ_NODENAME: "rabbit@rabbitmq3"
    volumes:
      - ./rabbitmq-cluster/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq-cluster/definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - "5674:5672"
      - "15674:15672"
    networks:
      - rabbitmq-cluster-net
    depends_on:
      - rabbitmq1

networks:
  rabbitmq-cluster-net:
    driver: bridge
