spring:
  application:
    name: producer
  rabbitmq:
    addresses: localhost:5672,localhost:5673,localhost:5674
    username: guest
    password: guest
    connection-timeout: 3000ms
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        max-attempts: 5
        multiplier: 2.0

server:
  port: 8081

rabbitmq:
  exchange:
    name: ha.direct.exchange
  queue:
    name: ha.mirrored.queue
  routing:
    key: ha.routing.key
